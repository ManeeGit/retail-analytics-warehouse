name: Warehouse CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - name: Preserve diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}
          path: /tmp/pytest-of-runner/**/build.log
