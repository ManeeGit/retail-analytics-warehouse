[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-warehouse"
version = "1.0.0"
description = "A teachable local analytics warehouse with replayable ingestion and atomic releases"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "dbt-duckdb>=1.9,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
retail = "retail_warehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
